<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop Live Monitor</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .monitor {
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
            background: #000;
        }

        /* ==============================
           LEFT
        ============================== */

        .left {
            min-width: 0;
            min-height: 0;
            padding: 14px;
            display: flex;
            flex-direction: column;
            background: #000;
        }

        /* ==============================
           HEADER
        ============================== */

        .header {
            height: 78px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #333;
        }

        .title-area h1 {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .title-area .subtitle {
            margin-top: 3px;
            color: #888;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .clock-area {
            text-align: right;
        }

        #time {
            font-size: 36px;
            line-height: 36px;
            font-weight: 900;
        }

        #date {
            margin-top: 5px;
            color: #aaa;
            font-size: 16px;
            font-weight: 700;
        }

        /* ==============================
           LEGEND
        ============================== */

        .legend {
            height: 46px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 18px;
            border-bottom: 1px solid #222;
            font-size: 12px;
            font-weight: 900;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot-assigned {
            background: #ffe600;
        }

        .dot-working {
            background: #2196f3;
        }

        .dot-waiting {
            background: #ff7b00;
        }

        .dot-completed {
            background: #22c55e;
        }

        .dot-unable {
            background: #ef4444;
        }

        /* ==============================
           LORRY GRID
        ============================== */

        .lorry-grid {
            flex: 1;
            min-height: 0;
            padding-top: 10px;

            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-template-rows: repeat(2, minmax(0, 1fr));

            gap: 10px;
        }

        /* ==============================
           LORRY CARD
        ============================== */

        .lorry-card {
            position: relative;
            min-width: 0;
            min-height: 0;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            background: #000;
            border: 2px solid #444;
            border-radius: 8px;
        }

        /*
           Flash layer.

           We use an overlay instead of changing only
           the card background.

           This makes the red flash visible even when
           technician rows have their own backgrounds.
        */

        .lorry-card::after {
            content: "";
            position: absolute;

            left: 0;
            right: 0;
            top: 60px;
            bottom: 25px;

            z-index: 50;

            background: rgba(255, 70, 70, 0);
            pointer-events: none;
        }

        .lorry-card.page-flash::after {
            animation: taskPageFlash 1.15s ease-out;
        }

        @keyframes taskPageFlash {
            0% {
                background: rgba(255, 80, 80, 0);
            }

            12% {
                background: rgba(255, 105, 105, 0.40);
            }

            30% {
                background: rgba(255, 70, 70, 0.12);
            }

            48% {
                background: rgba(255, 105, 105, 0.35);
            }

            70% {
                background: rgba(255, 70, 70, 0.10);
            }

            100% {
                background: rgba(255, 80, 80, 0);
            }
        }

        /* ==============================
           LORRY HEADER
        ============================== */

        .lorry-header {
            min-height: 60px;
            height: 60px;
            flex-shrink: 0;

            padding: 7px 12px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;

            background: #ffd400;
            color: #000;

            position: relative;
            z-index: 60;
        }

        .lorry-no {
            color: #000;
            font-size: 31px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .job-count {
            color: #000;
            font-size: 14px;
            font-weight: 900;
            white-space: nowrap;
        }

        /* ==============================
           TASK AREA
        ============================== */

        .task-scroll {
            flex: 1;
            min-height: 0;

            overflow: hidden;

            padding: 5px 10px;

            position: relative;
            z-index: 1;
        }

        .task {
            padding: 5px 0 7px;
            border-bottom: 1px solid #292929;
        }

        .task:last-child {
            border-bottom: none;
        }

        .task-name {
            margin-bottom: 3px;

            color: #fff;

            font-size: 21px;
            line-height: 24px;
            font-weight: 900;

            letter-spacing: 0.5px;
        }

        /* ==============================
           TECHNICIAN ROW
        ============================== */

        .tech {
            min-height: 33px;
            height: 33px;

            margin-top: 5px;
            padding: 5px 8px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 8px;

            border-left: 4px solid transparent;
            border-radius: 3px;
        }

        .tech-name {
            min-width: 0;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            font-size: 17px;
            font-weight: 900;
        }

        .tech-status {
            flex-shrink: 0;

            font-size: 14px;
            font-weight: 900;
        }

        /* ==============================
           STATUS
        ============================== */

        .assigned {
            background: #4d4000;
            color: #ffe600;
            border-left-color: #ffe600;
        }

        .working {
            background: #052f5f;
            color: #4da3ff;
            border-left-color: #2196f3;
        }

        .waiting {
            background: #512600;
            color: #ff922b;
            border-left-color: #ff7b00;
        }

        .completed {
            background: #073d20;
            color: #42e879;
            border-left-color: #22c55e;
        }

        .unable {
            background: #4b1010;
            color: #ff6b6b;
            border-left-color: #ef4444;
        }

        .closed {
            background: #262626;
            color: #aaa;
            border-left-color: #777;
        }

        /* ==============================
           TASK PAGE FOOTER
        ============================== */

        .task-page-info {
            height: 25px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-top: 1px solid #222;

            color: #777;

            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.5px;

            position: relative;
            z-index: 60;

            background: #000;
        }

        .task-page-info.multi {
            color: #ffd400;
        }

        /* ==============================
           EMPTY
        ============================== */

        .empty-card {
            min-width: 0;
            min-height: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 2px dashed #222;
            border-radius: 8px;

            color: #333;

            font-size: 18px;
            font-weight: 900;
        }

        /* ==============================
           MAIN FOOTER
        ============================== */

        .footer {
            height: 36px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding-top: 6px;

            color: #777;

            font-size: 11px;
            font-weight: 900;
        }

        #pageInfo {
            color: #aaa;
        }

        #nextPage {
            color: #ffd400;
        }

        /* ==============================
           RIGHT SIDE
        ============================== */

        .right {
            min-width: 0;
            min-height: 0;

            display: grid;
            grid-template-rows: 62% 38%;

            border-left: 2px solid #333;

            background: #050505;
        }

        .side-panel {
            min-height: 0;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        .side-panel + .side-panel {
            border-top: 2px solid #333;
        }

        .side-title {
            height: 47px;
            flex-shrink: 0;

            display: flex;
            align-items: center;

            padding: 0 14px;

            background: #111;
            border-bottom: 1px solid #333;

            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        /* ==============================
           TECH SUMMARY
        ============================== */

        .tech-summary {
            height: 66px;
            flex-shrink: 0;

            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 5px;
            padding: 6px;
        }

        .summary-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: #111;

            border: 1px solid #252525;
            border-radius: 4px;
        }

        .summary-number {
            font-size: 23px;
            font-weight: 900;
        }

        .summary-label {
            margin-top: 2px;

            color: #777;

            font-size: 9px;
            font-weight: 900;
        }

        /* ==============================
           TECHNICIAN LIVE
        ============================== */

        .technician-list {
            flex: 1;
            min-height: 0;

            overflow: hidden;

            padding: 0 7px 7px;
        }

        .technician-row {
            padding: 8px 7px;

            border-bottom: 1px solid #242424;
        }

        .tech-top {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 8px;

            font-size: 14px;
            font-weight: 900;
        }

        .tech-job {
            margin-top: 4px;

            color: #777;

            font-size: 11px;
            font-weight: 700;
        }

        /* ==============================
           READY
        ============================== */

        .ready-list {
            flex: 1;
            min-height: 0;

            overflow: hidden;

            padding: 7px;
        }

        .ready-item {
            margin-bottom: 7px;

            padding: 10px;

            background: #062d18;

            border: 1px solid #138a45;
            border-left: 5px solid #22c55e;

            border-radius: 5px;
        }

        .ready-lorry {
            color: #4ade80;

            font-size: 19px;
            font-weight: 900;
        }

        .ready-time {
            margin-top: 3px;

            color: #8fd6a9;

            font-size: 11px;
            font-weight: 700;
        }

        /* ==============================
           SMALLER DESKTOP
        ============================== */

        @media (max-width: 1400px) {

            .monitor {
                grid-template-columns: minmax(0, 1fr) 320px;
            }

            .title-area h1 {
                font-size: 28px;
            }

            #time {
                font-size: 31px;
            }

            .lorry-no {
                font-size: 27px;
            }

            .task-name {
                font-size: 18px;
            }

            .tech-name {
                font-size: 15px;
            }

            .tech-status {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<div class="monitor">

    <main class="left">

        <header class="header">

            <div class="title-area">
                <h1>🔧 WORKSHOP LIVE MONITOR</h1>
                <div class="subtitle">
                    LIVE WORKSHOP STATUS
                </div>
            </div>

            <div class="clock-area">
                <div id="time">--:--:--</div>
                <div id="date">LOADING...</div>
            </div>

        </header>


        <div class="legend">

            <div class="legend-item">
                <span class="legend-dot dot-assigned"></span>
                ASSIGNED
            </div>

            <div class="legend-item">
                <span class="legend-dot dot-working"></span>
                WORKING
            </div>

            <div class="legend-item">
                <span class="legend-dot dot-waiting"></span>
                WAITING
            </div>

            <div class="legend-item">
                <span class="legend-dot dot-completed"></span>
                COMPLETED
            </div>

            <div class="legend-item">
                <span class="legend-dot dot-unable"></span>
                UNABLE
            </div>

        </div>


        <section
            id="lorryGrid"
            class="lorry-grid">
        </section>


        <footer class="footer">

            <div id="pageInfo">
                PAGE 1 / 1
            </div>

            <div>
                SMART TASK AUTO PAGE
            </div>

            <div id="nextPage">
                LIVE MONITOR
            </div>

        </footer>

    </main>


    <aside class="right">

        <section class="side-panel">

            <div class="side-title">
                👨‍🔧 TECHNICIAN LIVE
            </div>


            <div class="tech-summary">

                <div class="summary-box">
                    <div
                        id="totalTech"
                        class="summary-number">
                        0
                    </div>

                    <div class="summary-label">
                        TOTAL
                    </div>
                </div>


                <div class="summary-box">
                    <div
                        id="workingTech"
                        class="summary-number">
                        0
                    </div>

                    <div class="summary-label">
                        WORKING
                    </div>
                </div>


                <div class="summary-box">
                    <div
                        id="availableTech"
                        class="summary-number">
                        0
                    </div>

                    <div class="summary-label">
                        AVAILABLE
                    </div>
                </div>

            </div>


            <div
                id="technicianList"
                class="technician-list">
            </div>

        </section>


        <section class="side-panel">

            <div class="side-title">
                🚚 READY FOR USE
            </div>

            <div
                id="readyList"
                class="ready-list">
            </div>

        </section>

    </aside>

</div>

<script src="monitor.js"></script>

</body>
</html>
