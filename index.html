<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Workshop Live Monitor</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
}


/* ==============================
   MAIN SCREEN
============================== */

.monitor{
    width:100vw;
    height:100vh;

    display:grid;
    grid-template-columns:minmax(0,1fr) 360px;

    background:#000;
}


/* ==============================
   LEFT
============================== */

.left{
    min-width:0;
    height:100vh;

    padding:14px;

    display:flex;
    flex-direction:column;

    background:#000;
}


/* ==============================
   HEADER
============================== */

.header{
    height:78px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:2px solid #333;

    padding:0 5px 10px 5px;
}

.title h1{
    font-size:34px;
    font-weight:900;
    letter-spacing:1px;
    color:#fff;
}

.title p{
    display:none;
}

.clock{
    text-align:right;
}

#time{
    font-size:36px;
    line-height:38px;
    font-weight:900;
    color:#fff;
}

#date{
    font-size:16px;
    margin-top:4px;
    font-weight:800;
    color:#fff;
}


/* ==============================
   LEGEND
============================== */

.legend{
    height:46px;
    flex-shrink:0;

    display:flex;
    align-items:center;

    gap:25px;

    padding:0 5px;

    border-bottom:1px solid #222;

    font-size:14px;
    font-weight:900;
}

.legend-item{
    display:flex;
    align-items:center;
    gap:7px;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
}


/* ==============================
   LORRY GRID
   6 LORRIES
============================== */

.lorry-grid{
    flex:1;
    min-height:0;

    padding-top:10px;

    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    grid-template-rows:
        repeat(2,minmax(0,1fr));

    gap:10px;
}


/* ==============================
   LORRY CARD
============================== */

.lorry-card{
    min-width:0;
    min-height:0;

    display:flex;
    flex-direction:column;

    background:#050505;

    border:2px solid #444;

    border-radius:8px;

    overflow:hidden;
}


/* ==============================
   YELLOW LORRY HEADER
============================== */

.lorry-header{
    min-height:60px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:10px 14px;

    background:#ffd400;

    border-bottom:2px solid #ffd400;
}

.lorry-no{
    font-size:31px;
    font-weight:900;
    letter-spacing:1px;

    color:#000;
}

.job-count{
    font-size:14px;
    font-weight:900;

    color:#000;
}


/* ==============================
   TASK AREA
   NO SCROLL
============================== */

.task-scroll{
    flex:1;
    min-height:0;

    overflow:hidden;

    padding:8px 13px 4px 13px;
}

.task{
    padding:9px 0 11px 0;

    border-bottom:2px solid #252525;
}

.task:last-child{
    border-bottom:none;
}

.task-name{
    font-size:21px;

    font-weight:900;

    letter-spacing:.5px;

    color:#fff;

    margin-bottom:7px;
}


/* ==============================
   TECHNICIAN INSIDE TASK
============================== */

.tech{
    width:100%;

    min-height:33px;

    margin-top:5px;

    padding:6px 10px;

    border-radius:5px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    font-weight:900;
}

.tech-name{
    font-size:17px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.tech-status{
    font-size:14px;

    white-space:nowrap;
}


/* ==============================
   STATUS COLORS
============================== */

.assigned{
    background:#4d4000;
    color:#ffe600;
    border-left:5px solid #ffe600;
}

.working{
    background:#052f5f;
    color:#4da3ff;
    border-left:5px solid #2196f3;
}

.waiting{
    background:#512600;
    color:#ff922b;
    border-left:5px solid #ff7b00;
}

.completed{
    background:#073d20;
    color:#42e879;
    border-left:5px solid #22c55e;
}

.unable{
    background:#4b1010;
    color:#ff6b6b;
    border-left:5px solid #ef4444;
}

.closed{
    background:#262626;
    color:#d4d4d4;
    border-left:5px solid #737373;
}


/* ==============================
   TASK PAGE INDICATOR
============================== */

.task-page-info{
    height:25px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-top:1px solid #222;

    background:#0a0a0a;

    color:#999;

    font-size:11px;

    font-weight:900;
}

.task-page-info.multi{
    color:#ffd400;
}


/* ==============================
   EMPTY LORRY
============================== */

.empty-card{
    min-width:0;
    min-height:0;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#030303;

    border:2px dashed #292929;

    border-radius:8px;

    color:#555;

    font-size:18px;

    font-weight:800;
}


/* ==============================
   MAIN PAGE FOOTER
============================== */

.footer{
    height:36px;
    flex-shrink:0;

    display:flex;

    align-items:flex-end;
    justify-content:space-between;

    padding:0 4px 2px 4px;

    color:#fff;

    font-size:14px;

    font-weight:900;
}


/* ==============================
   RIGHT SIDE
============================== */

.right{
    height:100vh;

    min-height:0;

    background:#000;

    border-left:3px solid #444;

    display:grid;

    grid-template-rows:62% 38%;
}


/* ==============================
   TECHNICIAN PANEL
============================== */

.technician-panel{
    min-height:0;

    display:flex;
    flex-direction:column;

    border-bottom:3px solid #444;
}

.panel-title{
    height:52px;

    flex-shrink:0;

    display:flex;
    align-items:center;

    padding:0 14px;

    background:#111;

    border-bottom:2px solid #333;
}

.panel-title h2{
    font-size:21px;

    font-weight:900;

    color:#fff;
}


/* ==============================
   TECH SUMMARY
============================== */

.tech-summary{
    flex-shrink:0;

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:7px;

    padding:9px;
}

.summary-box{
    background:#111;

    border:1px solid #292929;

    border-radius:6px;

    text-align:center;

    padding:8px 2px;
}

.summary-number{
    font-size:27px;

    font-weight:900;

    color:#fff;
}

.summary-label{
    font-size:10px;

    font-weight:800;

    margin-top:3px;

    color:#aaa;
}


/* ==============================
   TECHNICIAN LIST
   NO SCROLL
============================== */

.technician-list{
    flex:1;

    min-height:0;

    overflow:hidden;

    padding:0 9px 9px 9px;
}

.technician-row{
    background:#0d0d0d;

    border:1px solid #292929;

    border-radius:6px;

    padding:10px;

    margin-bottom:7px;
}

.tech-top{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:8px;

    font-size:16px;

    font-weight:900;
}

.tech-job{
    margin-top:5px;

    color:#d4d4d4;

    font-size:13px;

    font-weight:700;
}


/* ==============================
   READY LORRY
============================== */

.ready-panel{
    min-height:0;

    display:flex;
    flex-direction:column;
}

.ready-title{
    height:52px;

    flex-shrink:0;

    display:flex;
    align-items:center;

    padding:0 14px;

    background:#111;

    border-bottom:2px solid #333;
}

.ready-title h2{
    font-size:21px;

    font-weight:900;

    color:#fff;
}

.ready-list{
    flex:1;

    min-height:0;

    overflow:hidden;

    padding:10px;
}

.ready-item{
    background:#063b1d;

    border-left:6px solid #22c55e;

    border-radius:6px;

    padding:11px 12px;

    margin-bottom:9px;
}

.ready-lorry{
    color:#4ade80;

    font-size:22px;

    font-weight:900;
}

.ready-time{
    color:#d1fae5;

    font-size:12px;

    font-weight:700;

    margin-top:4px;
}


/* ==============================
   SMALLER SCREEN
============================== */

@media(max-width:1400px){

    .monitor{
        grid-template-columns:
            minmax(0,1fr) 320px;
    }

    .title h1{
        font-size:29px;
    }

    #time{
        font-size:31px;
    }

    .lorry-no{
        font-size:27px;
    }

    .task-name{
        font-size:18px;
    }

    .tech-name{
        font-size:15px;
    }

}

</style>
</head>


<body>

<div class="monitor">

    <!-- LEFT -->

    <main class="left">

        <header class="header">

            <div class="title">

                <h1>
                    🔧 WORKSHOP LIVE MONITOR
                </h1>

            </div>


            <div class="clock">

                <div id="time">
                    --:--:--
                </div>

                <div id="date">
                    ---
                </div>

            </div>

        </header>


        <!-- LEGEND -->

        <div class="legend">

            <div class="legend-item">
                <span class="dot"
                      style="background:#ffe600">
                </span>
                ASSIGNED
            </div>

            <div class="legend-item">
                <span class="dot"
                      style="background:#2196f3">
                </span>
                WORKING
            </div>

            <div class="legend-item">
                <span class="dot"
                      style="background:#ff7b00">
                </span>
                WAITING
            </div>

            <div class="legend-item">
                <span class="dot"
                      style="background:#22c55e">
                </span>
                COMPLETED
            </div>

            <div class="legend-item">
                <span class="dot"
                      style="background:#ef4444">
                </span>
                UNABLE
            </div>

        </div>


        <!-- LORRY GRID -->

        <section
            class="lorry-grid"
            id="lorryGrid">
        </section>


        <!-- FOOTER -->

        <footer class="footer">

            <div id="pageInfo">
                PAGE 1 / 1
            </div>

            <div id="nextPage">
                LIVE MONITOR
            </div>

        </footer>

    </main>



    <!-- RIGHT -->

    <aside class="right">


        <!-- TECHNICIAN LIVE -->

        <section class="technician-panel">

            <div class="panel-title">

                <h2>
                    👨‍🔧 TECHNICIAN LIVE
                </h2>

            </div>


            <div class="tech-summary">

                <div class="summary-box">

                    <div
                        class="summary-number"
                        id="totalTech">
                        0
                    </div>

                    <div class="summary-label">
                        TOTAL
                    </div>

                </div>


                <div class="summary-box">

                    <div
                        class="summary-number"
                        id="workingTech">
                        0
                    </div>

                    <div class="summary-label">
                        WORKING
                    </div>

                </div>


                <div class="summary-box">

                    <div
                        class="summary-number"
                        id="availableTech">
                        0
                    </div>

                    <div class="summary-label">
                        AVAILABLE
                    </div>

                </div>

            </div>


            <div
                class="technician-list"
                id="technicianList">
            </div>

        </section>



        <!-- READY -->

        <section class="ready-panel">

            <div class="ready-title">

                <h2>
                    🚛 READY FOR USE
                </h2>

            </div>


            <div
                class="ready-list"
                id="readyList">
            </div>

        </section>

    </aside>

</div>


<script src="monitor.js"></script>

</body>
</html>
